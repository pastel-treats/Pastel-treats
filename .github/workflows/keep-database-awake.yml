# Free Supabase projects pause after 7 days without any visits.
# This visits the bakery database every 2 days so the shop never goes to sleep (free, runs on GitHub).
name: Keep database awake
on:
  schedule:
    - cron: '30 3 */2 * *'   # every 2 days, 9 AM India time
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ylgkbbjnxpwjellsbpna.supabase.co/rest/v1/settings?select=id&limit=1" \
            -H "apikey: sb_publishable_9HairGKKRUJnwUCLowgATA_WbQxOcZL")
          echo "Database answered: $code"
          test "$code" = "200"
